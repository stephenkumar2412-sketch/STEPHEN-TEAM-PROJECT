<!DOCTYPE html>
<html>
<head>
<title>ComicCraft Preview</title>
<style>
body{font-family:Arial;background:#f3f4f6;margin:0}.wrap{max-width:900px;margin:30px auto}
.panel{background:white;padding:22px;margin:25px 0;border-radius:16px;box-shadow:0 5px 20px #0001}
.panel img{width:100%;max-height:600px;object-fit:cover;border-radius:12px}
.scene{font-style:italic;color:#555}.text{white-space:pre-wrap;line-height:1.6}
.btn{display:inline-block;padding:13px 20px;background:#111827;color:#fff;border-radius:9px;text-decoration:none;margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>📖 Your Comic</h1>
<a class="btn" href="{{ pdf_path }}" download>⬇ Download Your Comic as PDF</a>
{% for panel in layout %}
<div class="panel">
    <h2>Panel {{ panel.panel_number }}: {{ panel.title }}</h2>
    <img src="{{ panel.image }}" alt="Comic panel">
    <p class="scene">{{ panel.scene_description }}</p>
    <div class="text">{{ panel.text }}</div>
    <hr>
    <small><b>Image Prompt:</b> {{ panel.image_prompt }}</small>
</div>
{% endfor %}
<a class="btn" href="/export-success">Continue</a>
</div>
</body>
</html>
